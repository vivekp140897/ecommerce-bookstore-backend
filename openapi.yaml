openapi: 3.0.3
info:
  title: E-Commerce Bookstore API
  description: >
    RESTful backend API for an e-commerce bookstore application.
    Covers user management, product catalogue, cart operations,
    checkout, payments, order lifecycle, reviews, and wishlists.
  version: 1.0.0
  contact:
    name: Bookstore API Support
    email: api-support@bookstore.example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://api.bookstore.example.com/v1
    description: Production

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: User profile management
  - name: Addresses
    description: Shipping / billing address management
  - name: Categories
    description: Book category CRUD
  - name: Books
    description: Book catalogue CRUD
  - name: Cart
    description: Shopping cart management
  - name: Checkout
    description: Checkout flow – discount, order creation, payment
  - name: Orders
    description: Order retrieval and management
  - name: Payments
    description: Payment retrieval
  - name: Reviews
    description: Book reviews and ratings
  - name: Wishlist
    description: User wishlist management

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived JWT access token obtained from POST /auth/login.
        Pass as `Authorization: Bearer <token>`.

security:
  - BearerAuth: []

# ---------------------------------------------------------------------------
# Reusable schemas
# ---------------------------------------------------------------------------
  schemas:

    # ── Pagination ──────────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 142
        totalPages:
          type: integer
          example: 8
      required: [page, pageSize, totalItems, totalPages]

    # ── Error ────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: The request body is invalid.
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
      required: [code, message]

    # ── User ─────────────────────────────────────────────────────────────────
    UserBase:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          example: Jane
        lastName:
          type: string
          maxLength: 100
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+14155552671"
      required: [firstName, lastName, email]

    UserCreateRequest:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            password:
              type: string
              format: password
              minLength: 12
              description: >
                Must be at least 12 characters and contain uppercase, lowercase,
                digit, and special character.
          required: [password]

    UserUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/UserBase'

    User:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            role:
              type: string
              enum: [customer, admin]
              readOnly: true
              example: customer
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
        - $ref: '#/components/schemas/UserBase'
      required: [id, firstName, lastName, email, role, createdAt, updatedAt]

    # ── Auth ─────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (15 minutes)
        refreshToken:
          type: string
          description: Opaque refresh token (7 days)
        expiresIn:
          type: integer
          description: Access token TTL in seconds
          example: 900
      required: [accessToken, refreshToken, expiresIn]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    # ── Address ──────────────────────────────────────────────────────────────
    AddressBase:
      type: object
      properties:
        label:
          type: string
          example: Home
        line1:
          type: string
          example: 123 Main Street
        line2:
          type: string
          example: Apt 4B
        city:
          type: string
          example: San Francisco
        state:
          type: string
          example: CA
        postalCode:
          type: string
          example: "94105"
        country:
          type: string
          example: US
        isDefault:
          type: boolean
          default: false
      required: [line1, city, state, postalCode, country]

    Address:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            userId:
              type: string
              format: uuid
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
        - $ref: '#/components/schemas/AddressBase'
      required: [id, userId, line1, city, state, postalCode, country]

    # ── Category ─────────────────────────────────────────────────────────────
    CategoryBase:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: Science Fiction
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: science-fiction
        description:
          type: string
          example: Speculative fiction exploring futuristic concepts.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: ID of the parent category (null for top-level)
      required: [name, slug]

    Category:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
        - $ref: '#/components/schemas/CategoryBase'
      required: [id, name, slug]

    CategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Book ─────────────────────────────────────────────────────────────────
    BookBase:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          example: "Dune"
        author:
          type: string
          maxLength: 255
          example: "Frank Herbert"
        isbn:
          type: string
          pattern: '^(?:\d{9}[\dX]|97[89]\d{10})$'
          example: "9780441013593"
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
          example: 14.99
        stockQuantity:
          type: integer
          minimum: 0
          example: 150
        coverImageUrl:
          type: string
          format: uri
          example: https://cdn.bookstore.example.com/covers/dune.jpg
        language:
          type: string
          example: en
        pageCount:
          type: integer
          minimum: 1
          example: 896
        publishedDate:
          type: string
          format: date
          example: "1990-10-01"
        publisher:
          type: string
          example: Ace Books
        categoryId:
          type: string
          format: uuid
      required: [title, author, isbn, price, stockQuantity, categoryId]

    Book:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            averageRating:
              type: number
              format: float
              minimum: 0
              maximum: 5
              readOnly: true
              example: 4.7
            reviewCount:
              type: integer
              readOnly: true
              example: 312
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
        - $ref: '#/components/schemas/BookBase'
      required: [id, title, author, isbn, price, stockQuantity, categoryId]

    BookList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Cart ─────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cartId:
          type: string
          format: uuid
          readOnly: true
        bookId:
          type: string
          format: uuid
        book:
          $ref: '#/components/schemas/Book'
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPrice:
          type: number
          format: decimal
          readOnly: true
          description: Price snapshotted at the time the item was added
          example: 14.99
        subtotal:
          type: number
          format: decimal
          readOnly: true
          example: 29.98
      required: [id, cartId, bookId, quantity, unitPrice, subtotal]

    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        itemCount:
          type: integer
          readOnly: true
          example: 3
        subtotal:
          type: number
          format: decimal
          readOnly: true
          example: 44.97
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [id, userId, items, itemCount, subtotal]

    AddCartItemRequest:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 1
      required: [bookId, quantity]

    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3
      required: [quantity]

    # ── Discount / Coupon ────────────────────────────────────────────────────
    ApplyDiscountRequest:
      type: object
      properties:
        couponCode:
          type: string
          example: SUMMER20
      required: [couponCode]

    DiscountResult:
      type: object
      properties:
        couponCode:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed]
        discountValue:
          type: number
          format: decimal
          example: 20.00
        discountAmount:
          type: number
          format: decimal
          description: Monetary value deducted from the cart total
          example: 8.99
        newTotal:
          type: number
          format: decimal
          example: 36.98
      required: [couponCode, discountType, discountValue, discountAmount, newTotal]

    # ── Order ────────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orderId:
          type: string
          format: uuid
          readOnly: true
        bookId:
          type: string
          format: uuid
        book:
          $ref: '#/components/schemas/Book'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: decimal
        subtotal:
          type: number
          format: decimal
      required: [id, orderId, bookId, quantity, unitPrice, subtotal]

    CreateOrderRequest:
      type: object
      properties:
        shippingAddressId:
          type: string
          format: uuid
          description: ID of an existing saved address
        billingAddressId:
          type: string
          format: uuid
          description: Defaults to shippingAddressId when omitted
        couponCode:
          type: string
          description: Optional coupon code to apply at checkout
          example: SUMMER20
        paymentMethodToken:
          type: string
          description: >
            Opaque token representing the payment instrument, produced
            by the client-side payment SDK (never raw card data).
      required: [shippingAddressId, paymentMethodToken]

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled, refunded]
          readOnly: true
          example: confirmed
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        billingAddress:
          $ref: '#/components/schemas/Address'
        couponCode:
          type: string
          nullable: true
        subtotal:
          type: number
          format: decimal
          example: 44.97
        discountAmount:
          type: number
          format: decimal
          example: 8.99
        shippingCost:
          type: number
          format: decimal
          example: 5.99
        tax:
          type: number
          format: decimal
          example: 3.12
        total:
          type: number
          format: decimal
          example: 45.09
        payment:
          $ref: '#/components/schemas/Payment'
        placedAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [id, userId, status, items, shippingAddress, subtotal, discountAmount, shippingCost, tax, total, placedAt]

    OrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Payment ──────────────────────────────────────────────────────────────
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orderId:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum: [pending, authorised, captured, failed, refunded]
          readOnly: true
          example: captured
        method:
          type: string
          enum: [card, paypal, bank_transfer, wallet]
          example: card
        amount:
          type: number
          format: decimal
          example: 45.09
        currency:
          type: string
          example: USD
        transactionId:
          type: string
          description: External payment gateway reference
          example: ch_3NpABC1234
        processedAt:
          type: string
          format: date-time
          readOnly: true
      required: [id, orderId, status, method, amount, currency]

    # ── Review ───────────────────────────────────────────────────────────────
    ReviewBase:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        title:
          type: string
          maxLength: 150
          example: "An absolute masterpiece"
        body:
          type: string
          maxLength: 5000
          example: "Dune is a groundbreaking work of science fiction..."
      required: [rating]

    Review:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            bookId:
              type: string
              format: uuid
              readOnly: true
            userId:
              type: string
              format: uuid
              readOnly: true
            verifiedPurchase:
              type: boolean
              readOnly: true
              description: True when the reviewer has a delivered order containing this book
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
        - $ref: '#/components/schemas/ReviewBase'
      required: [id, bookId, userId, rating, verifiedPurchase, createdAt]

    ReviewList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Wishlist ─────────────────────────────────────────────────────────────
    WishlistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bookId:
          type: string
          format: uuid
        book:
          $ref: '#/components/schemas/Book'
        addedAt:
          type: string
          format: date-time
          readOnly: true
      required: [id, bookId, addedAt]

    Wishlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/WishlistItem'
        itemCount:
          type: integer
          readOnly: true
      required: [id, userId, items, itemCount]

    AddWishlistItemRequest:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
      required: [bookId]

  # ── Reusable parameters ─────────────────────────────────────────────────
  parameters:
    PathUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathBookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathCartItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathOrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathPaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathAddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathWishlistItemId:
      name: wishlistItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    QueryPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    QuerySearch:
      name: q
      in: query
      description: Full-text search query
      schema:
        type: string

  # ── Reusable responses ───────────────────────────────────────────────────
  responses:
    NoContent:
      description: Success – no content returned
    BadRequest:
      description: Bad request – validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict (e.g. duplicate ISBN, duplicate review)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Semantic validation failure (e.g. insufficient stock, expired coupon)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# ===========================================================================
# Paths
# ===========================================================================
paths:

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new customer account
      security: []
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain tokens
      security: []
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token (logout)
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Users ─────────────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getMe
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Update the authenticated user's profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/PathUserId'
    get:
      tags: [Users]
      summary: Get a user by ID (admin only)
      operationId: getUserById
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete a user account (admin only)
      operationId: deleteUser
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Addresses ────────────────────────────────────────────────────────────
  /users/me/addresses:
    get:
      tags: [Addresses]
      summary: List saved addresses for the authenticated user
      operationId: listAddresses
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Addresses]
      summary: Add a new address
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBase'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
